[project]
name = "saans"
version = "1.0.0"
description = "GenAI assistant that helps families navigate severe winter smog and urban air pollution."
requires-python = ">=3.10"
dependencies = ["flask>=3.0", "requests>=2.31", "python-dotenv>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["saans"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "C4", "C90", "I", "N", "RET", "PIE"]
ignore = ["UP037"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "N802", "SIM117"]
"saans/llm.py" = ["E501"]  # long prompt strings

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
